name: TradeSphere CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  container:
    name: Demo container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build same-origin demo image
        run: docker build -t tradesphere:ci .
      - name: Verify packaged demo readiness and API boundary
        run: |
          export POSTGRES_DB=tradesphere_container_ci POSTGRES_USER=tradesphere_ci
          export POSTGRES_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$POSTGRES_PASSWORD"
          docker compose up -d --wait --wait-timeout 90
          docker run -d --name tradesphere-demo --network tradesphere_default -p 127.0.0.1:8082:8080 --memory=512m \
            -e DATABASE_JDBC_URL=jdbc:postgresql://postgres:5432/tradesphere_container_ci \
            -e DATABASE_USERNAME="$POSTGRES_USER" -e DATABASE_PASSWORD="$POSTGRES_PASSWORD" \
            -e BOOTSTRAP_ENABLED=false tradesphere:ci
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8082/actuator/health/readiness; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          curl --fail --silent http://127.0.0.1:8082/dashboard | grep -q '<div id="root">'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8082/api/v1/dashboard)" = 401
      - name: Clean up demo containers
        if: always()
        run: |
          docker rm -f tradesphere-demo || true
          POSTGRES_DB=tradesphere_container_ci POSTGRES_USER=tradesphere_ci POSTGRES_PASSWORD=unused docker compose down --volumes
  backend:
    name: Backend, PostgreSQL and browser workflow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Configure disposable database
        run: |
          echo "POSTGRES_DB=tradesphere_ci" >> "$GITHUB_ENV"
          echo "POSTGRES_USER=tradesphere_ci" >> "$GITHUB_ENV"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "E2E_POSTGRES_DB=tradesphere_ci" >> "$GITHUB_ENV"
          e2e_password=$(openssl rand -hex 24)
          echo "::add-mask::$e2e_password"
          echo "E2E_PASSWORD=$e2e_password" >> "$GITHUB_ENV"
      - name: Validate Compose and start PostgreSQL
        run: |
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 90
      - name: Build and run backend tests
        working-directory: backend
        run: ./mvnw -B -ntp verify
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run critical browser workflow
        working-directory: frontend
        run: npm run test:e2e
      - name: Database diagnostics on failure
        if: failure()
        run: docker compose logs postgres
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: frontend/test-results/
          retention-days: 3
      - name: Stop disposable database
        if: always()
        run: docker compose down --volumes

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Check documentation links
        run: pwsh -File ../scripts/check-doc-links.ps1
