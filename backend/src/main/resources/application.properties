spring.application.name=TradeSphere
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:tradesphere}
spring.datasource.username=${POSTGRES_USER:tradesphere}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.hikari.connection-timeout=5000
spring.flyway.clean-disabled=true
spring.flyway.default-schema=public

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
tradesphere.bootstrap.enabled=${BOOTSTRAP_ENABLED:false}
